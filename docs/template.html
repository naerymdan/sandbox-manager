<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{BASE}}
<title>{{TITLE}} · msb-manager docs</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="dark light">
{{META}}
<link rel="icon" href="assets/brand/msb-manager-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script>
  // Before the stylesheet paints: the stored choice, else the system's. Kept
  // inline so a light-mode visitor never sees a dark flash.
  (function () {
    var pref = null;
    try { pref = localStorage.getItem("msb-docs-theme"); } catch (e) {}
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var root = document.documentElement;
    root.dataset.themePref = pref || "auto";
    root.dataset.theme = pref || (dark ? "dark" : "light");
  })();
</script>
</head>
<body>
<a class="skip" href="#main">skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <button class="menu-btn" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">≡</button>
    <a class="brand" href="index.html" aria-label="msb-manager documentation home">
      <img class="brand-mark" src="assets/brand/msb-manager-mark-dotmatrix-dark.svg" alt="" width="26" height="26">
      <span class="brand-path">~/msb-manager</span><span class="brand-dollar">$</span><span class="brand-cmd">docs</span><span class="cursor" aria-hidden="true"></span>
    </a>
    <span class="version" title="Documentation for this release">v{{VERSION}}</span>
    <div class="search" role="search">
      <label class="search-label" for="search" aria-hidden="true">grep</label>
      <input id="search" type="search" placeholder="search…" autocomplete="off" spellcheck="false"
             aria-label="Search the documentation" aria-controls="search-results" aria-expanded="false">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>
    <button id="theme-toggle" class="btn" type="button" aria-label="Colour theme: automatic">[auto]</button>
    <a class="btn gh" href="{{REPO_URL}}" rel="noopener" aria-label="msb-manager on GitHub">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>github</span>
    </a>
  </div>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Documentation">
    {{NAV}}
  </nav>

  <main id="main" class="content" tabindex="-1">
    <article class="doc">
      <h1><span class="h1-prompt" aria-hidden="true">$ man </span>{{HEADING}}</h1>
      {{BODY}}
    </article>
    {{PAGER}}
    <footer class="footer">
      <span>msb-manager v{{VERSION}} · MIT</span>
      <a href="{{EDIT_URL}}" rel="noopener">edit this page</a>
    </footer>
  </main>

  {{TOC}}
</div>

<script src="assets/search-index.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
